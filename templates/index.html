<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fortnite Bot Web UI</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Fortnite Bot Web UI</h1>
      <p>Type commands like <code>!hello</code>, <code>!skin Nog Ops</code>, <code>!emote Floss</code></p>
    </header>
    <main>
      <div id="messages" aria-live="polite"></div>
    </main>
    <footer>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="Enter command..." autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </footer>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
